<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Age Verification</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: 'Lato', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #2c1506;
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 50% 40%, #7a3818 0%, transparent 60%),
        radial-gradient(ellipse at 10% 90%, #3a1808 0%, transparent 50%),
        linear-gradient(160deg, #1a0a04 0%, #3a1c0a 50%, #1a0a04 100%);
    }

    .card {
      position: relative;
      z-index: 1;
      background: linear-gradient(160deg, #fff9f2 0%, #fdeedd 100%);
      border-radius: 20px;
      padding: 60px 56px;
      max-width: 480px;
      width: 92%;
      text-align: center;
      box-shadow: 0 32px 80px rgba(0,0,0,0.6), 0 0 0 1px rgba(220,150,60,0.2);
      animation: rise 0.9s cubic-bezier(.22,1,.36,1) forwards;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(30px) scale(0.96); }
      to   { opacity: 1; transform: translateY(0) scale(1); }
    }

    .icon {
      font-size: 48px;
      margin-bottom: 20px;
      display: block;
    }

    .badge {
      display: inline-block;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #b05818;
      background: rgba(176,88,24,0.1);
      padding: 5px 16px;
      border-radius: 20px;
      border: 1px solid rgba(176,88,24,0.3);
      margin-bottom: 28px;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: 44px;
      font-weight: 700;
      color: #2c1506;
      line-height: 1.1;
      margin-bottom: 16px;
    }

    h1 em {
      font-style: italic;
      color: #c05818;
    }

    p {
      font-size: 13.5px;
      font-weight: 300;
      color: #7a5030;
      line-height: 1.75;
      margin-bottom: 36px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .btn {
      display: block;
      width: 100%;
      padding: 20px 24px;
      font-family: 'Lato', sans-serif;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.22s ease;
      text-decoration: none;
    }

    .btn-yes {
      background: linear-gradient(135deg, #27ae60, #1a8a48);
      color: #fff;
      box-shadow: 0 8px 28px rgba(39,174,96,0.45);
    }
    .btn-yes:hover {
      background: linear-gradient(135deg, #2ecc71, #22a858);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(39,174,96,0.55);
    }

    .btn-no {
      background: linear-gradient(135deg, #e74c3c, #b52a1e);
      color: #fff;
      box-shadow: 0 8px 28px rgba(231,76,60,0.4);
    }
    .btn-no:hover {
      background: linear-gradient(135deg, #f05a4a, #c83228);
      transform: translateY(-2px);
      box-shadow: 0 14px 36px rgba(231,76,60,0.5);
    }

    .legal {
      margin-top: 24px;
      font-size: 10px;
      color: #b09070;
      line-height: 1.65;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="icon">🔞</span>
    <div class="badge">Age Verification</div>

    <h1>Are you<br/><em>18 years</em><br/>or older?</h1>

    <p>This site contains adult content intended for mature audiences only. Please confirm your age to continue.</p>

    <div class="buttons">
      <a href="https://safeoffers.pro/a/73BpXtRJNfN6w3" class="btn btn-yes">✔ &nbsp; Yes, I'm 18+</a>
      <button class="btn btn-no" onclick="window.history.back(); setTimeout(()=>window.location.replace('about:blank'),80);">✖ &nbsp; No, Exit</button>
    </div>

    <p class="legal">By entering you confirm you are of legal age in your jurisdiction and agree to view adult content.</p>
  </div>
</body>
</html>
